<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project | Mel's Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ==================== HEADER ==================== -->
    <header role="banner">
      <nav class="container" role="navigation" aria-label="Main navigation">
        <div class="logo">
          <span><a href="index.html">Melvin.</a></span>
        </div>

        <!-- Hamburger Icon -->
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <!-- Navigation Links -->
        <ul class="nav-links" id="navLinks">
          <li><a href="./#projects">← Back to Projects</a></li>
        </ul>

        <div class="overlay" id="overlay"></div>
      </nav>
    </header>

    <!-- WhatsApp floating button -->
    <a
      id="whatsapp-button"
      class="whatsapp-fab"
      href="https://wa.me/09018232175?text=Hello%20Mel!%20I%20found%20your%20portfolio%20and%20would%20like%20to%20chat."
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open WhatsApp chat"
    >
      <!-- Inline WhatsApp SVG (keeps styling predictable) -->
      <svg
        viewBox="0 0 24 24"
        width="22"
        height="22"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M20.5 3.5A11.9 11.9 0 0012 .5 11.9 11.9 0 003.5 3.5 11.9 11.9 0 00.5 12c0 2.1.55 4.05 1.6 5.8L.1 23.5l5.1-1.35A11.9 11.9 0 0012 23.5a11.9 11.9 0 009.5-5.5A11.9 11.9 0 0023.5 12 11.9 11.9 0 0020.5 3.5zM12 21a9 9 0 01-4.75-1.34l-.34-.2-3.03.8.8-2.95-.2-.34A9 9 0 1112 21zm5.17-6.5c-.29-.15-1.73-.86-2-.96-.27-.1-.47-.15-.67.15-.2.29-.77.96-.95 1.16-.17.2-.34.22-.63.07-.29-.15-1.21-.45-2.3-1.4-.85-.76-1.43-1.7-1.6-1.99-.17-.29-.02-.44.13-.59.13-.13.29-.34.44-.51.14-.17.19-.29.29-.48.1-.19.03-.37-.02-.52-.05-.15-.67-1.62-.92-2.22-.24-.57-.48-.49-.67-.5l-.57-.01c-.19 0-.5.07-.77.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.88 1.2 3.08.14.2 2.06 3.34 4.99 4.68 2.93 1.33 2.93.89 3.46.83.53-.06 1.73-.7 1.98-1.38.25-.68.25-1.26.18-1.38-.07-.12-.27-.19-.57-.34z"
        />
      </svg>
    </a>

    <!-- ==================== PROJECT DETAILS SECTION ==================== -->
    <section id="project-details">
      <div class="container" id="projectContainer">
        <!-- Dynamic project content loads here -->
      </div>
    </section>

    <!-- ==================== FOOTER ==================== -->
    <footer role="contentinfo">
      <div class="container">
        <p>&copy; <span id="currentYear">2025</span>. All rights reserved.</p>
        <ul class="social-links">
          <li>
            <a
              href="https://github.com/akanbasseymelvin"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                <path
                  d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
                ></path>
              </svg>
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/melvin-akan-bassey-458873300/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                <path
                  d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
                ></path>
              </svg>
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/heeismelvin/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="white"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm5 6.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm4.75-3.25a.875.875 0 11-1.75 0 .875.875 0 011.75 0z"
                ></path>
              </svg>
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="projects.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // === MOBILE NAV TOGGLE ===
        const hamburger = document.querySelector(".hamburger");
        const navLinks = document.querySelector(".nav-links");
        if (hamburger && navLinks) {
          hamburger.addEventListener("click", () => {
            hamburger.classList.toggle("active");
            navLinks.classList.toggle("active");
          });
        }

        // === AUTO UPDATE YEAR ===
        const yearEl = document.getElementById("currentYear");
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        // === DYNAMIC PROJECT LOADER ===
        const container = document.getElementById("projectContainer");
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get("id"), 10);

        if (!window.projects || !Array.isArray(window.projects)) {
          container.innerHTML = `
            <div class="glass-panel">
              <h2>Error loading project data</h2>
              <p>projects.js not found or not formatted properly.</p>
            </div>`;
          return;
        }

        const project = window.projects[id];
        if (!project) {
          container.innerHTML = `
            <div class="glass-panel">
              <h2>Project not found</h2>
              <p>Invalid or missing project ID.</p>
            </div>`;
          return;
        }

        // === UPDATE PAGE TITLE ===
        document.title = project.title + " | Mel's Portfolio";

        // === BUILD PROJECT HTML ===
        const imagesHTML = project.images
          .map(
            (img) =>
              `<img src="${img}" alt="${project.title}" style="width:40%; border-radius:var(--radius);" />`
          )
          .join("");

        const tagsHTML = project.tech
          .map((tag) => `<span class="tag">${tag}</span>`)
          .join("");

        const detailsHTML = project.details
          .map((li) => `<li>${li}</li>`)
          .join("");

        container.innerHTML = `
          <div class="section-header" style="margin-top: 7rem;">
            <h2>${project.title}</h2>
            <p>${project.subtitle || ""}</p>
          </div>

          <div class="glass-panel projects-pic-hero" style="padding:1rem; margin-bottom:3rem; display:flex; flex-wrap:wrap; justify-content:center; gap:2rem;">
            ${imagesHTML}
          </div>

          <div class="glass-panel" style="padding:2rem; margin-bottom:3rem;">
            <h3>Overview</h3>
            <p style="color:var(--white-muted); margin-top:1rem;">${
              project.description
            }</p>
            <div class="project-tags" style="margin-top:1.5rem;">
              ${tagsHTML}
            </div>
          </div>

          <div class="glass-panel" style="padding:2rem; margin-top:4rem;">
            <h3>Technical Details</h3>
            <ol style="margin-top:1rem; margin-left:1rem; color:var(--white-muted); line-height:1.8;">
              ${detailsHTML}
            </ol>
          </div>

          <div class="glass-panel nav-btn" style="padding:2rem; margin-top:3rem; text-align:center;">
            <a href="${
              project.repo
            }" target="_blank" class="btn btn-secondary">View on GitHub</a>
            <a href="${
              project.live
            }" target="_blank" class="btn btn-primary">Live Demo</a>
          </div>

          <div style="text-align:center; margin-top:4rem;">
            <a href="../index.html#projects" class="btn btn-secondary">← Back to Projects</a>
          </div>
        `;
      });
    </script>
  </body>
</html>
